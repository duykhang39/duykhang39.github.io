<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn 30 từ vựng tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--bg1:#e6f6fb;--bg2:#fdeff3;--card:#fff;--ink:#16294a;--mut:#5d6f8f;--line:#d5e2ee;--c0:#ff6b6b;--c1:#ffa62b;--c2:#1fb5a5;--c3:#7c6cf0;--c4:#2f80ed;--c5:#e0529c;--ok:#1fa971;--no:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f1a30;--bg2:#241636;--card:#1b2745;--ink:#eef2fc;--mut:#a3b2d3;--line:#32426a;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0f1a30;--bg2:#241636;--card:#1b2745;--ink:#eef2fc;--mut:#a3b2d3;--line:#32426a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg1);background-image:radial-gradient(circle at 10% 8%,color-mix(in srgb,var(--c2) 22%,transparent),transparent 40%),radial-gradient(circle at 92% 12%,color-mix(in srgb,var(--c5) 20%,transparent),transparent 38%),radial-gradient(circle at 80% 95%,color-mix(in srgb,var(--c1) 22%,transparent),transparent 40%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
.wrap{max-width:880px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
h1,h2,h3{font-family:"Baloo 2",Nunito,system-ui,sans-serif;margin:0;line-height:1.15}
.logo{font-size:1.5rem;font-weight:800;flex:1}
.logo span{display:inline-block;background:linear-gradient(90deg,var(--c0),var(--c5),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.prog{width:120px;height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c2),var(--c1));transition:width .4s}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.menu{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{position:relative;overflow:hidden;text-align:left;background:var(--card);border:3px solid var(--c);border-radius:26px 26px 26px 6px;padding:18px;box-shadow:6px 6px 0 var(--c);transition:transform .15s}
.tile:hover{transform:translate(-2px,-2px)}
.tile b{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--c);font-size:2rem;margin-bottom:10px}
.tile h3{font-size:1.3rem}.tile p{margin:4px 0 0;color:var(--mut);font-weight:700}
h2.t{margin:26px 0 10px;font-size:1.25rem}h2.t small{font-family:Nunito;color:var(--mut);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;overflow:hidden;background:var(--card);border:2px solid hsl(var(--h) 70% 60%);border-radius:30px;padding:6px 12px;font-weight:700}
.chip i{position:absolute;left:0;bottom:0;height:4px;background:hsl(var(--h) 70% 55%)}
.em{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 8px;border-radius:38% 62% 55% 45%/50% 45% 55% 50%;background:hsl(var(--h) 85% 88%);border:3px solid hsl(var(--h) 70% 60%);font-size:2.6rem}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .em{background:hsl(var(--h) 45% 30%)}}
:root[data-theme="dark"] .em{background:hsl(var(--h) 45% 30%)}
.sub{text-align:center;color:var(--mut);font-weight:800;margin:6px 0 12px}
.qbox,.box{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:22px 18px;text-align:center}
.qbox h1{font-size:2.1rem}.qbox h2{font-size:1.5rem;margin:6px 0}
small{color:var(--mut);font-weight:700}
.ipa{font-family:"Segoe UI","Noto Sans",sans-serif;color:var(--c4);font-weight:700;margin:4px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt,.mb{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:13px 12px;font-weight:800;font-size:1rem;transition:transform .12s,background .2s}
.opt:hover,.mb:hover{border-color:var(--c4)}
.ok{background:color-mix(in srgb,var(--ok) 28%,var(--card))!important;border-color:var(--ok)!important}
.no{background:color-mix(in srgb,var(--no) 25%,var(--card))!important;border-color:var(--no)!important;animation:sk .3s}
.sel{border-color:var(--c3)!important;background:color-mix(in srgb,var(--c3) 22%,var(--card))!important}
.mb:disabled{opacity:.55}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:11px 18px;font-weight:800}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--no);border-color:var(--no);color:#fff}
.btn.main{background:var(--c4);border-color:var(--c4);color:#fff}
.card{perspective:900px;height:300px;position:relative;cursor:pointer;max-width:460px;margin:0 auto}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card);border:3px solid var(--c0);border-radius:30px;box-shadow:8px 8px 0 var(--c0);backface-visibility:hidden;transition:transform .5s;padding:14px}
.face.back{transform:rotateY(180deg);border-color:var(--c2);box-shadow:8px 8px 0 var(--c2)}
.card.flip .face{transform:rotateY(180deg)}.card.flip .face.back{transform:rotateY(360deg)}
.sp{background:var(--c1);border-radius:50%;width:46px;height:46px;font-size:1.3rem;margin-top:6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mt>div{display:grid;gap:10px;align-content:start}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.slot{width:38px;height:46px;border-bottom:4px solid var(--c3);display:grid;place-items:center;font-size:1.6rem;font-weight:800}
.slot.gap{border:0;width:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile2{width:46px;height:50px;border-radius:14px;background:var(--c3);color:#fff;font-size:1.5rem;font-weight:800;box-shadow:0 4px 0 color-mix(in srgb,var(--c3) 60%,#000)}
.tile2:disabled{opacity:.25}
input[type=text]{width:100%;max-width:420px;font:inherit;font-size:1.4rem;font-weight:800;text-align:center;padding:12px;border-radius:16px;border:3px solid var(--c4);background:var(--bg1);color:var(--ink);margin-top:10px}
.hint{font-family:monospace;font-size:1.6rem;letter-spacing:.1em;min-height:2rem;color:var(--c3);font-weight:800}
#fb{min-height:2.2rem;margin-top:10px;font-weight:800;font-size:1.1rem}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c5),var(--c1));width:100%;transition:width 1s linear}
.big{font-size:3rem;font-family:"Baloo 2",sans-serif;font-weight:800;color:var(--c4)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo"><span>Ôn 30 từ vựng</span> 🧠</div><div class="prog" title="Mức thuộc"><i id="pg"></i></div><button class="menu" id="mn" data-b="home">← Menu</button></header>
<main id="stage"></main>
</div>
<script>
const RAW=`ancestor|noun|/ˈænˌsestər/|tổ tiên, ông bà tiên sinh|👴
apply for|phrasal verb|/əˈplaɪ fɔːr/|nộp đơn xin, ứng tuyển vào|📝
arrangement|noun|/əˈreɪndʒmənt/|sự sắp xếp, sắp đặt|🗂️
bring together|ph. v|/brɪŋ təˈɡeðər/|kết hợp, tụ tập|🤝
climate change|noun|/ˈklaɪmət tʃeɪndʒ/|biến đổi khí hậu|🌍
conference|noun|/ˈkɒnfərəns/|hội nghị, hội thảo|🎤
contribute (to)|verb|/kənˈtrɪbjuːt tuː/|đóng góp (cho)|🎁
contribution|noun|/ˌkɒntrɪˈbjuːʃən/|đóng góp, cống hiến|💝
cultural exchange|noun|/ˈkʌltʃərəl ɪksˈtʃeɪndʒ/|trao đổi văn hóa|🎎
current issue|noun|/ˈkɜːrənt ˈɪʃuː/|vấn đề hiện tại, vấn đề đang xảy ra|📰
depend on|ph. v|/dɪˈpend ɒn/|phụ thuộc vào, dựa vào|⚖️
development|noun|/dɪˈveləpmənt/|phát triển|🌱
disability|noun|/ˌdɪsəˈbɪləti/|khuyết tật, tàn tật|♿
discuss|verb|/dɪˈskʌs/|thảo luận, bàn luận|💬
experience|noun/verb|/ɪkˈspɪəriəns/|kinh nghiệm, trải nghiệm|🧳
eye-opening|adj|/ˈaɪ ˌoʊpənɪŋ/|mở mang tầm mắt, mở rộng kiến thức|👀
gender equality|noun|/ˈdʒendər ɪˈkwɒlɪti/|bình đẳng giới|🚻
interview|noun/verb|/ˈɪntərˌvjuː/|phỏng vấn, cuộc phỏng vấn|🎙️
issue|noun|/ˈɪʃuː/|vấn đề, sự cấp phát|❗
keen on|phrase|/kiːn ɒn/|say mê, đam mê về|😍
leadership skills|noun|/ˈliːdərʃɪp skɪlz/|kỹ năng lãnh đạo|👑
make friends|phrase|/meɪk frends/|kết bạn|🧑‍🤝‍🧑
make sure|phrase|/meɪk ʃʊr/|đảm bảo, chắc chắn|✅
participate|verb|/pɑːrˈtɪsɪˌpeɪt/|tham gia, tham dự|🙋
peace|noun|/piːs/|hòa bình|🕊️
problem-solving skills|noun|/ˈprɑːbləm ˌsɑːlvɪŋ skɪlz/|kỹ năng giải quyết vấn đề|🧩
promote|verb|/prəˈmoʊt/|thúc đẩy, khuyến khích|📣
propose|verb|/prəˈpoʊz/|đề xuất, đề nghị|💡
prosperity|noun|/prɒˈsperɪti/|thịnh vượng, phồn vinh|💰
put out a call|phrase|/pʊt aʊt ə kɔːl/|phát đi thông báo, gửi thông cáo|📢`;
const W=RAW.split("\n").map((l,i)=>{const[w,t,p,m,e]=l.split("|");return{i,w,t,p,m,e,a:w.replace(/[^a-z]/gi,"").toLowerCase(),d:w.replace(/[()]/g,"").replace(/\s+/g," ")}});
const $=s=>document.querySelector(s),st=$("#stage");
const sh=a=>[...a].sort(()=>Math.random()-.5);
const pick=(n,ex)=>sh(W.filter(x=>x!==ex)).slice(0,n);
const em=w=>`<span class="em" style="--h:${w.i*12}">${w.e}</span>`;
let M={},H={},T,cur;
try{M=JSON.parse(localStorage.getItem("v30")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("v30",JSON.stringify(M))}catch(e){}};
const up=(i,n=1)=>{M[i]=Math.min(5,(M[i]||0)+n);save();head()};
const dn=i=>{M[i]=Math.max(0,(M[i]||0)-1);save();head()};
function head(){let s=0;W.forEach(w=>s+=M[w.i]||0);$("#pg").style.width=s/1.5+"%"}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
st.onclick=e=>{const b=e.target.closest("[data-b]");if(b&&H[b.dataset.b])H[b.dataset.b](b)};
$("#mn").onclick=()=>home();
const G=[["Thẻ ghi nhớ","🃏","Lật thẻ, nghe phát âm, tự chấm","flash"],["Trắc nghiệm","🎯","10 câu: chọn nghĩa, chọn từ","quiz"],["Nối cặp","🔗","Ghép 6 từ với nghĩa, bấm giờ","match"],["Xếp chữ","🔤","Sắp chữ cái thành từ đúng","scr"],["Viết thuộc lòng","✍️","Nhìn nghĩa, tự viết ra từ","write"],["Đúng hay Sai","⚡","60 giây phản xạ, ăn combo","tf"]];
const GF={flash,quiz,match,scr,write,tf};
function go(k){clearInterval(T);H={};cur=GF[k];$("#mn").style.display="block";cur()}
function home(){clearInterval(T);H={go:b=>go(b.dataset.v),say:b=>say(W[b.dataset.v].d),home};$("#mn").style.display="none";
st.innerHTML=`<div class="grid">${G.map((g,k)=>`<button class="tile" style="--c:var(--c${k})" data-b="go" data-v="${g[3]}"><b>${g[1]}</b><h3>${g[0]}</h3><p>${g[2]}</p></button>`).join("")}</div><h2 class="t">30 từ cần nhớ <small>(chạm để nghe · gạch dưới = mức thuộc)</small></h2><div class="chips">${W.map(w=>`<button class="chip" style="--h:${w.i*12}" data-b="say" data-v="${w.i}">${w.e} ${w.w}<i style="width:${(M[w.i]||0)*20}%"></i></button>`).join("")}</div>`;head()}
function end(title,body){st.innerHTML=`<div class="box"><h2>${title}</h2><div class="big">${body[0]}</div><p>${body[1]||""}</p><div class="row"><button class="btn main" data-b="again">Chơi lại</button><button class="btn" data-b="home">Chọn trò khác</button></div></div>`;H.again=()=>cur();H.home=home}

/* 1. Thẻ ghi nhớ */
function flash(){let d=sh(W),f=0;
const r=()=>{if(!d.length)return end("🎉 Đã qua hết 30 thẻ!",["30/30","Bạn đã lật hết mọi thẻ."]);const w=d[0];
st.innerHTML=`<p class="sub">Còn ${d.length} thẻ · chạm vào thẻ để lật</p><div class="card" data-b="flip"><div class="face">${em(w)}<h1>${w.w}</h1><small>${w.t}</small><button class="sp" data-b="spk">🔊</button></div><div class="face back"><h2>${w.m}</h2><p class="ipa">${w.p}</p><small>${w.t}</small></div></div><div class="row"><button class="btn bad" data-b="no">Chưa thuộc</button><button class="btn good" data-b="yes">Đã thuộc</button></div>`};
H={flip:()=>$(".card").classList.toggle("flip"),spk:()=>{event.stopPropagation();say(d[0].d)},yes:()=>{up(d[0].i);d.shift();r()},no:()=>{d.push(d.shift());r()},home};r()}

/* 2. Trắc nghiệm */
function quiz(){let q=sh(W).slice(0,10),n=0,sc=0,wr=[],lock=0,w;
const r=()=>{if(n>=10)return end("Kết quả",[sc+"/10",wr.length?"Cần ôn lại: "+wr.join(", "):"Hoàn hảo! 🌟"]);
w=q[n];const vi=n%2==0,op=sh([w,...pick(3,w)]);
st.innerHTML=`<p class="sub">Câu ${n+1}/10 · Đúng ${sc}</p><div class="qbox">${em(w)}${vi?`<h1>${w.w}</h1><p class="ipa">${w.p}</p><small>Chọn nghĩa tiếng Việt đúng</small>`:`<h2>${w.m}</h2><small>Chọn từ tiếng Anh đúng</small>`}<div class="opts">${op.map(o=>`<button class="opt" data-b="ans" data-v="${o.i}">${vi?o.m:o.w}</button>`).join("")}</div></div>`;if(vi)say(w.d)};
H={ans:b=>{if(lock)return;lock=1;const ok=+b.dataset.v===w.i;if(ok){sc++;up(w.i);say(w.d)}else{wr.push(w.w);dn(w.i)}
document.querySelectorAll(".opt").forEach(o=>{if(+o.dataset.v===w.i)o.classList.add("ok");else if(o===b)o.classList.add("no")});
setTimeout(()=>{n++;lock=0;r()},ok?800:1600)},home};r()}

/* 3. Nối cặp */
function match(){let s=sh(W).slice(0,6),a=null,done=0,t0=Date.now();
st.innerHTML=`<p class="sub">Chọn một từ, rồi chọn nghĩa tương ứng</p><div class="mt"><div>${sh(s).map(w=>`<button class="mb" data-b="l" data-v="${w.i}">${w.w}</button>`).join("")}</div><div>${sh(s).map(w=>`<button class="mb" data-b="r" data-v="${w.i}">${w.m}</button>`).join("")}</div></div>`;
H={l:b=>{document.querySelectorAll('[data-b="l"]').forEach(x=>x.classList.remove("sel"));a=b;b.classList.add("sel");say(W[b.dataset.v].d)},
r:b=>{if(!a)return;if(a.dataset.v===b.dataset.v){[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.disabled=true});up(+b.dataset.v);a=null;if(++done==6)setTimeout(()=>end("Nối xong! 🔗",[Math.round((Date.now()-t0)/1000)+" giây","Thử nhanh hơn ở vòng sau."]),500)}
else{[a,b].forEach(x=>{x.classList.add("no");setTimeout(()=>x.classList.remove("no","sel"),400)});dn(+a.dataset.v);a=null}},home}}

/* 4. Xếp chữ */
function scr(){let q=sh(W),k=0;
const r=()=>{const w=q[k%30],L=[...w.a],tiles=sh(L.map((c,i)=>i));let ans=[],c=0,lock=0;
const paint=()=>{const sl=[...w.d].map(ch=>/[a-z]/i.test(ch)?`<span class="slot">${ans[c++]!==undefined?L[ans[c-1]]:""}</span>`:`<span class="slot gap"></span>`).join("");c=0;
st.innerHTML=`<p class="sub">Từ ${k+1} · bấm chữ cái theo đúng thứ tự</p><div class="qbox">${em(w)}<h2>${w.m}</h2><small>${w.t}</small><div class="slots">${sl}</div><div class="tiles">${tiles.map(i=>`<button class="tile2" data-b="t" data-v="${i}" ${ans.includes(i)?"disabled":""}>${L[i]}</button>`).join("")}</div><div class="row"><button class="btn" data-b="undo">⌫ Xóa</button><button class="btn good" data-b="chk">✔ Kiểm tra</button><button class="btn" data-b="skip">Bỏ qua</button></div></div>`};
H={t:b=>{if(lock)return;ans.push(+b.dataset.v);paint()},chk:()=>{if(lock||ans.length<L.length)return;lock=1;if(ans.map(i=>L[i]).join("")==w.a){up(w.i);say(w.d);document.querySelectorAll(".slot").forEach(s=>s.style.color="var(--ok)");setTimeout(()=>{k++;r()},1100)}else{dn(w.i);document.querySelector(".slots").style.animation="sk .3s";setTimeout(()=>{lock=0;paint()},500)}},
undo:()=>{if(!lock){ans.pop();paint()}},skip:()=>{k++;r()},home};paint()};r()}

/* 5. Viết thuộc lòng */
function write(){let q=sh(W),k=0;
const r=()=>{const w=q[k%30];let h=0,tries=0,lock=0;
st.innerHTML=`<p class="sub">Từ ${k+1} · nhìn nghĩa, tự viết từ tiếng Anh</p><div class="qbox">${em(w)}<h2>${w.m}</h2><small>${w.t}</small><div class="hint" id="hn"></div><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ tiếng Anh…"><div class="row"><button class="btn" data-b="hint">💡 Gợi ý</button><button class="btn good" data-b="chk">Kiểm tra</button><button class="btn" data-b="skp">Bỏ qua</button></div><div id="fb"></div></div>`;
const inp=$("#in");inp.focus();inp.onkeydown=e=>{if(e.key==="Enter")H.chk()};
const nxt=ms=>{lock=1;setTimeout(()=>{k++;r()},ms)};
H={hint:()=>{h++;let c=0;$("#hn").textContent=[...w.d].map(ch=>/[a-z]/i.test(ch)?(c++<h?ch:"_"):ch).join(" ")},
chk:()=>{if(lock)return;const v=inp.value.toLowerCase().replace(/[^a-z]/g,"");if(!v)return;
if(v===w.a){up(w.i,tries?1:2);say(w.d);$("#fb").innerHTML=`<span style="color:var(--ok)">✅ Chính xác! ${w.d} <span class="ipa">${w.p}</span></span>`;nxt(1400)}
else{tries++;dn(w.i);inp.style.animation="sk .3s";setTimeout(()=>inp.style.animation="",350);

skp:()=>{$("#fb").innerHTML=`Đáp án: <b>${w.d}</b> <span class="ipa">${w.p}</span>`;say(w.d);nxt(2500)},home}};r()}
